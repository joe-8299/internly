name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -v
      - run: npm test
      - name: Write test report
        run: npm run report
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: |
            TEST_REPORT.md
